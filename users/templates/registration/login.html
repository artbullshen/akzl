{% extends "zlapp/base.html" %}

{% block main1 %}
   <!-- container -->
  <div class="container">
  
  <div class="card">
    <div class="card-header">
      <h3>用户登录</h3>
    </div>
    <div class="card-body">

   
  {% if form.errors %}
    <h4>用户名和密码不相符！请重新输入：</h4>
  {% endif %}

  <form method="post" action="{% url 'users:login' %}">
    {% csrf_token %}
    {{ form.as_p }}

    <button name="submit">登录</button>
    <input type="hidden" name="next"
      value="{% url 'zlapp:index' %}" />
  </form>

  </div>
  </div>

  </div> 

{% endblock main1 %}

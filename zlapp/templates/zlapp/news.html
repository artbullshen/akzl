{% extends "zlapp/base1.html" %}
{% load static %}

{% block main1 %}
  <h3 class="text-center">张岭最新动态</h3>
  <div class="card">

    <div class="card-header">
      <p class="text-center">2026，张岭更好！安康更好！</p>

      <div id="myCarousela" class="carousel slide" data-ride="carousel" data-bs-interval="1000">

        <!--轮播（Carousel）指标-->
        <ol class="carousel-indicators">
          <li data-target="#myCarousela" data-slide-to="0" class="active"></li>
          <li data-target="#myCarousela" data-slide-to="1"></li>
          <li data-target="#myCarousela" data-slide-to="2"></li>
          <li data-target="#myCarousela" data-slide-to="3"></li>
          <li data-target="#myCarousela" data-slide-to="4"></li>

        </ol>
        <!--轮播（Carousel）项目-->
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="{% static 'images/zlapp/carousel/carousel8.jpg' %}" class="img-fluid"  alt="张岭8">
            <div class="carousel-caption">已经运营的安康西高铁站</div>
            </div>
          <div class="carousel-item">
            <img src="{% static 'images/zlapp/carousel/carousel9.jpg' %}" class="img-fluid" alt="张岭9">
            <div class="carousel-caption">高铁快线公交车也开通了</div>
          </div>
          <div class="carousel-item ">
            <img src="{% static 'images/zlapp/carousel/carousel1.jpg' %}" class="img-fluid" alt="张岭1">
            <div class="carousel-caption">新通车的张岭中路</div>
          </div>

          <div class="carousel-item">
            <img src="{% static 'images/zlapp/carousel/carousel3.jpg' %}" class="img-fluid" alt="张岭3">
            <div class="carousel-caption">张岭人居环境最佳的小区</div>
          </div>
          <div class="carousel-item">
            <img src="{% static 'images/zlapp/carousel/carousel4.jpg' %}" class="img-fluid" alt="张岭4">
            <div class="carousel-caption">张岭五区更新改造中</div>
          </div>
        </div>

        <!--轮播（Carousel）导航-->
        <a class="carousel-control-prev" href="#myCarousela" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>

        </a>
        <a class="carousel-control-next" href="#myCarousela" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>


      </div>

    </div>

  </div>


  <ul>
    {% for new in news %}
      <li>
      <h6>{{ new.text }}</h6>
      <p>{{ new.date_added }}</p>
      <p>{{ new.cont }}</p>
      </li>
    {% endfor %}
  </ul>



{% endblock main1 %}

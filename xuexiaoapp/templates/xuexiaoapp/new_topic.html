{% extends "bjxzapp/base.html" %}

{% block cemian %}
  <p>我的主题 </p>

  <ul>
    {% for topic in topics %}

       <li><a href="{% url 'bjxzapp:topic' topic.id %}">{{ topic }}</a></li>

    {% empty %}
      </li>No topics have been added yet.</li>
    {% endfor %}

  </ul>


{% endblock cemian %}





{% block main1 %}

  <h3>添加新的主题:
    <li>{{ topic }}</li>
  </h3>

  <form action="{% url 'bjxzapp:new_topic' %}" method='post'>
    {% csrf_token %}
    {{ form.as_p }}
    <button name="submit">添加主题</button>
  </form>




{% endblock main1 %}
